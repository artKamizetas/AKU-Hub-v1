# ==============================================================
# CONFIGURAÇÕES DO SISTEMA
# Este arquivo substitui a aba CONFIGURACOES do Google Sheets.
# Edite os valores abaixo conforme sua operação.
# ==============================================================

# --- FONTE DE DADOS ---
fonte:
  # Nome da fonte de dados (exibido no rodapé da Home)
  nome: "Supabase — Bling ERP"

# --- DEPÓSITOS ---
# IMPORTANTE: No Bling, "Loja" e "Depósito" são entidades diferentes.
# Loja ID → aparece nos Pedidos (onde a venda aconteceu)
# Depósito ID → aparece no EstoqueV3 (onde o estoque está armazenado)
# Uma loja física tem AMBOS os IDs.
depositos:
  central:
    deposito_id: "11105614627"   # Depósito "Estoque" (CD)
    nome: "Estoque Central"

  lojas:
  - nome: "Natal"
    loja_id: "203379922"         # Loja "AKU - Natal" (usado em Pedidos)
    deposito_id: "7011018386"    # Depósito "Natal - Loja" (usado em EstoqueV3)
  - nome: "Mossoró"
    loja_id: "203575032"         # Loja "AKU - Mossoró" (usado em Pedidos)
    deposito_id: "14887086441"   # Depósito "Mossoró - Loja" (usado em EstoqueV3)

# --- LOGÍSTICA (Reposição de Loja) ---
logistica:
  vm_padrao: 2              # Visual Merchandising — exposição mínima padrão (fallback se VM dinâmico não cobrir o SKU)
  dias_analise_giro: 30     # Janela de dias para calcular giro

# --- VM DINÂMICO (Reposição de Loja — cálculo por SKU a partir de vendas reais) ---
vm:
  dias_cobertura: 15          # Dias de demanda que o VM de prateleira deve cobrir
  inicio_alta: 10              # Mês de início da alta temporada (1-12)
  fim_alta: 3                  # Mês de fim da alta temporada (1-12)
  mult_pa: 2.0                 # Multiplicador sobre peças/atendimento (piso do VM)
  vm_minimo: 2                 # VM mínimo absoluto por SKU
  lead_time: 3                 # Dias de lead time de reposição (usado no pulmão)
  nivel_servico_default: 95    # Nível de serviço padrão (%) quando o colégio não tem override
  aplicar_crescimento: true    # Liga/desliga o fator de crescimento (colégio×grupo) no VM, p/ comparar

# --- COLÉGIOS (parâmetros do VM Dinâmico por colégio/marca) ---
# Nome do colégio (igual ao valor de Marca_sku) → parâmetros específicos.
# Colégio não cadastrado aqui usa taxa_crescimento 1.0 e vm.nivel_servico_default.
colegios:
  # Exemplo:
  # "ADC":
  #   taxa_crescimento: 1.1
  #   nivel_servico: 95

# --- NORMALIZAÇÃO DE COLÉGIOS (de-para do Marca_sku cru → nome de exibição) ---
# O colégio chega cru do Supabase (extração por string da SKU na pipeline
# externa) e gera ruído em SKUs fora de padrão (ex: "27"). Este de-para
# renomeia/agrupa esses valores SEM tocar na origem. Só liste o que MUDA —
# valor ausente mantém o cru (identidade). Use "Outros" para juntar o ruído.
# Editável na página de Configurações. Ver docs/requisitos/normalizacao-colegios.md
colegios_alias:
  '28': Outros
  '33': Outros
  '32': Outros
  '27': Outros
  # Exemplo:
  # "27": "Outros"
  # "31": "Outros"
  # "NEV": "Nova Era"

# --- DAILY (Comercial / Metas) ---
daily:
  # IDs de situação que contam como VENDA EFETIVA
  # 9 = Atendido. Adicione outros se necessário (ex: 28487 = Enviado)
  situacoes_venda: [9]

  # IDs de status de pedido para exibição no dashboard
  status_ids:
    em_aberto: 6
    em_andamento: 15
    pronto_retirada: 28488

  # Metas financeiras do mês atual (R$)
  metas:
    Natal: 70000.0
    Mossoró: 50000.0

# --- PCP / FÁBRICA ---
fabrica:
  crescimento_pct: 10.0      # % de crescimento — fallback para colégios sem taxa própria em config["colegios"]
  cobertura_meses: 2         # Fallback: cobertura de estoque (meses) quando planejamento.rodadas_datas está vazio
  correcao_manual: 0         # Ajuste fixo somado à demanda projetada de TODO SKU (global)

  # IDs de situação que representam BACKLOG (consomem estoque sem faturar)
  situacoes_backlog: [6, 15]

# --- DEMANDA (motor único usado por Fábrica e Planejamento) ---
# Modelo ancorado na ALTA: a demanda de cada SKU vem das vendas reais da
# última temporada de alta × crescimento; a baixa só adiciona volume de
# manutenção (fator medido dos dados). Política order-up-to com estoque de
# segurança por nível de serviço.
demanda:
  # Thresholds da sazonalidade agregada (fallback/shape de manutenção)
  min_vendas_colegio: 30
  min_meses_colegio: 6

  # Janela de alta temporada, em ordem cronológica (âncora da demanda)
  janela_alta:                 # Dez, Jan, Fev (Jan pico, Fev declínio)

  # Nível de serviço → estoque de segurança (não pode faltar na alta)
  - 12
  - 1
  - 2
  nivel_servico_alta: 99       # %
  nivel_servico_baixa: 92      # %
  variacao_demanda: 0.25       # coeficiente de variação da demanda — incerteza de previsão, calibrável

  # Liga/desliga o fator de crescimento no cálculo da fábrica (p/ comparar)
  aplicar_crescimento_fabrica: true

  # Camada OBSERVADA do crescimento: mede o crescimento realizado por
  # colégio×segmento nas altas e usa como baseline quando não há override
  # manual em config["colegios"]. false = volta ao +10% cego (fabrica.crescimento_pct).
  crescimento_observado_ativo: true

  # Proporção da baixa = base GLOBAL medida (Σbaixa/Σalta, últimos 2 ciclos).
  # Overrides manuais (vencem a base, do mais específico ao geral):
  #   - por SKU:     excecoes_sku[SKU].proporcao_baixa   (cauda idiossincrática, ex: NEV009)
  #   - por colégio: colegios[COLÉGIO].proporcao_baixa   (ex: vende o ano todo)
  # Editáveis na página de Configurações. (backtest: fatiar por categoria não
  # melhora — global + override manual nos poucos gigantes é o que sustenta.)

# --- AGRUPAMENTO DE GRUPOS EM SEGMENTOS ---
# Nível intermediário usado para medir o crescimento observado (colégio×segmento).
# O código traz um default; o que estiver aqui sobrescreve. Reagrupe pela página
# de Configurações (ou aqui) para testar outros cortes. Grupo ausente = "Outros".
grupo_segmento:
  BER: Infantil
  EIN: Infantil
  IDF: Infantil          # Infantil + Ed.Física → principal Infantil
  EIF: Inf+Fund          # combo Infantil + Fundamental
  EF1: Fundamental
  EF2: Fundamental
  EFD: Fundamental
  FDF: Fundamental       # Fundamental + Ed.Física → principal Fundamental
  EME: Médio
  PRE: Médio
  CUR: Médio
  EFM: Médio             # combo Fundamental + Médio → Médio
  TEI: Tempo Integral
  DIA: Diário            # uniforme diário (legado SES)
  EDF: Ed. Física        # uniforme de ed. física (todo aluno)
  ESP: Esporte           # times/equipe (opcional)
  EQP: Esporte
  OPC: Outros

# --- PLANEJAMENTO DE PRODUÇÃO ANUAL ---
# Define as rodadas de produção ao longo do ano.
# Cada rodada dispara um pedido à fábrica que deve cobrir a demanda
# até a próxima rodada chegar. A margem de segurança vem do nível de
# serviço (order-up-to), não de um buffer percentual.
planejamento:
  # ===== CALENDÁRIO DE RODADAS =====
  # Datas REAIS de disparo, deste ano E do próximo — nada se repete
  # automaticamente. Permite rodada atrasada este ano e antecipada no próximo.
  # A ÚLTIMA data só serve para fechar o intervalo da penúltima (inclua sempre
  # a primeira rodada do ano seguinte). São necessárias 2+ datas.
  # Exemplo:
  # rodadas_datas: ["2026-07-20", "2026-10-01", "2027-02-01", "2027-06-15"]
  # Este ano: Jul, Out. Ano que vem: Mar, Jun, Out. A última data (Mar/2028) só
  # fecha o intervalo do Out/2027 (não gera pedido próprio).
  rodadas_datas:
  - '2026-07-01'
  - '2026-10-01'
  - '2027-03-01'
  - '2027-06-01'
  - '2027-10-01'
  - '2028-03-01'

  # Lead time de produção (semanas) — tempo entre disparar e receber
  lead_time_semanas: 4

  # Período histórico único: a janela de vendas passadas que ensina o FORMATO
  # do ano (sazonalidade mês a mês) e a base dos SKUs que só vendem na baixa.
  # NÃO define o tamanho do pico — esse vem das vendas reais da última alta.
  # IMPORTANTE: Use o período mais amplo possível (ideal: 12+ meses, incluindo
  # meses de baixa). Com mais histórico = projeção mais precisa.
  periodo_historico_inicio: "2025-01-01"
  periodo_historico_fim: "2025-12-31"

# --- EXCEÇÕES POR SKU ---
# Sobrescreve regras globais para produtos específicos.
# Campos opcionais:
#   vm       → força o VM de prateleira do SKU (Reposição de Loja)
#   correcao → ajuste (unidades no PCP / fator no VM dinâmico) do SKU
excecoes_sku:
  # Exemplo:
  # "ABC-PP":
  #   vm: 5
  #   correcao: 10
